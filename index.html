<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBRARY - Daily Inspiration & Search</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        /* Anti-Copy & Security Settings */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        body {
            font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 800px;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            letter-spacing: 3px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Search Bar */
        .search-box {
            width: 100%;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        /* Main Card */
        .main-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .image-container {
            width: 100%;
            height: 320px;
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .date-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .content {
            padding: 30px;
        }

        .event-tag {
            display: inline-block;
            background: #eab308;
            color: #0f172a;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .thought-text {
            font-size: 1.4rem;
            line-height: 1.9;
            font-family: 'Tiro Devanagari Hindi', serif;
            color: #f1f5f9;
            margin-bottom: 20px;
        }

        .thought-author {
            font-size: 1.15rem;
            color: #38bdf8;
            font-weight: 600;
            text-align: right;
        }

        .calendar-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Search Results Container */
        .search-results {
            max-width: 800px;
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .result-item {
            background: rgba(30, 41, 59, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <h1>📚 LIBRARY</h1>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="filterContent()" placeholder="Search thoughts, authors, or topics (e.g. Kalam, Success, Science)...">
        </div>
    </div>

    <!-- Main Daily Display -->
    <div class="main-card" id="mainCard">
        <div class="image-container">
            <img id="thoughtImg" src="" alt="Daily Thought Picture">
            <div class="date-badge" id="todayDate">Loading date...</div>
        </div>
        <div class="content">
            <div class="event-tag" id="daySpecial">📌 Aaj Ka Vishesh</div>
            <div class="thought-text" id="thoughtText">Loading thought...</div>
            <div class="thought-author" id="thoughtAuthor">Author</div>

            <div class="calendar-info">
                <span id="calendarDayCount">🗓️ Day 1 of 365</span>
                <span>365-Days Knowledge Portal</span>
            </div>
        </div>
    </div>

    <!-- Search Results View -->
    <div class="search-results" id="searchResults"></div>

    <script>
        // Disable F12, Ctrl+U, Inspect Element
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || 
               (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        };

        // 365-Day Extended Database (Sample Entries)
        const database = [
            {
                day: 1,
                event: "विज़न और कड़ी मेहनत / Vision & Hardwork",
                thought: "सफलता केवल एक रात में नहीं मिलती, इसके पीछे वर्षों की निरंतर मेहनत, अनुशासन और असफलता से सीखने का अटूट प्रयास होता है। जब आप अपने समय को सही दिशा में लगाते हैं, तो दुनिया की कोई ताकत आपको आपके लक्ष्य तक पहुँचने से नहीं रोक सकती।",
                author: "— डॉ. एपीजे अब्दुल कलाम",
                image: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=800&auto=format&fit=crop&q=80"
            },
            {
                day: 2,
                event: "युवा शक्ति और संकल्प / Youth Inspiration",
                thought: "उठो, जागो और तब तक मत रुको जब तक कि तुम अपने लक्ष्य को प्राप्त न कर लो। जीवन में कठिनाइयां हमें बर्बाद करने नहीं आतीं, बल्कि हमारे अंदर छिपे हुए सामर्थ्य और शक्तियों को बाहर निकालने आती हैं।",
                author: "— स्वामी विवेकानंद",
                image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800&auto=format&fit=crop&q=80"
            },
            {
                day: 3,
                event: "शिक्षा की शक्ति / Power of Knowledge",
                thought: "शिक्षा दुनिया का सबसे शक्तिशाली हथियार है जिसका उपयोग आप पूरी दुनिया को बदलने के लिए कर सकते हैं। यह न केवल आपके चरित्र का निर्माण करती है बल्कि आपको किसी भी परिस्थिति में सिर उठाकर जीने की ताकत देती है।",
                author: "— नेल्सन मंडेला",
                image: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=800&auto=format&fit=crop&q=80"
            },
            {
                day: 4,
                event: "समय प्रबंधन / Value of Time",
                thought: "जो व्यक्ति समय का सही उपयोग करना सीख जाता है, वह सफलता की आधी सीढ़ी पहले ही चढ़ चुका होता है। आलस्य आपका सबसे बड़ा शत्रु है और अनुशासन आपकी सबसे बड़ी ढाल।",
                author: "— आचार्य चाणक्य",
                image: "https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=800&auto=format&fit=crop&q=80"
            }
        ];

        // Day of Year Calculator (1 to 365)
        function getDayOfYear() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // Initialize Daily Content
        function initPortal() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('todayDate').innerText = now.toLocaleDateString('hi-IN', options);

            const dayNum = getDayOfYear();
            const dataIndex = (dayNum - 1) % database.length; // Cycles automatically
            const todayData = database[dataIndex];

            document.getElementById('thoughtImg').src = todayData.image;
            document.getElementById('daySpecial').innerText = "📌 " + todayData.event;
            document.getElementById('thoughtText').innerText = "“" + todayData.thought + "”";
            document.getElementById('thoughtAuthor').innerText = todayData.author;
            document.getElementById('calendarDayCount').innerText = "🗓️ Day " + dayNum + " of 365";
        }

        // Live Search Logic
        function filterContent() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const mainCard = document.getElementById('mainCard');
            const resultsContainer = document.getElementById('searchResults');

            if (input === "") {
                mainCard.style.display = "block";
                resultsContainer.style.display = "none";
                return;
            }

            mainCard.style.display = "none";
            resultsContainer.style.display = "flex";
            resultsContainer.innerHTML = "";

            const filtered = database.filter(item => 
                item.thought.toLowerCase().includes(input) || 
                item.author.toLowerCase().includes(input) || 
                item.event.toLowerCase().includes(input)
            );

            if (filtered.length === 0) {
                resultsContainer.innerHTML = "<div class='result-item' style='text-align:center;'>Koi result nahi mila. Doosra word search karein.</div>";
            } else {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `
                        <div class="event-tag">📌 ${item.event}</div>
                        <div style="font-family:'Tiro Devanagari Hindi', serif; font-size:1.2rem; margin:12px 0;">“${item.thought}”</div>
                        <div style="color:#38bdf8; font-weight:600; text-align:right;">${item.author}</div>
                    `;
                    resultsContainer.appendChild(div);
                });
            }
        }

        initPortal();
    </script>
</body>
</html>
